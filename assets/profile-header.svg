<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Hey, I'm Zun — AI and Automation Engineer</title>
  <desc id="desc">A midnight blue banner with animated cyan signals and the message: Practical AI. Reliable automation.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d35"/><stop offset="1" stop-color="#070e1b"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#94a3b8" opacity="0.13"/></pattern>
    <clipPath id="typing"><rect x="44" y="200" width="620" height="34"><animate attributeName="width" values="0;0;620;620;0" keyTimes="0;0.06;0.44;0.98;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <rect width="960" height="300" rx="18" fill="url(#bg)"/>
  <rect width="960" height="300" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="958" height="298" rx="17" fill="none" stroke="#26344b"/>
  <rect x="44" y="40" width="28" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="84" y="46" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#94a3b8">AZIZUN USSAMA / ZUN</text>
  <text x="44" y="123" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="700" letter-spacing="-2" fill="#f1f5f9">Hey, I'm Zun.</text>
  <text x="46" y="163" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#a5b4fc">AI &amp; Automation Engineer</text>
  <text x="46" y="224" font-family="monospace" font-size="19" fill="#67e8f9" clip-path="url(#typing)">Practical AI. Reliable automation.</text>
  <text x="46" y="266" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.6" fill="#71839d">DOCUMENTS · DATA · BUSINESS WORKFLOWS</text>
  <g fill="none" stroke="#243852" stroke-width="1.5">
    <path d="M690 62H760L812 114V163L870 221H918"/>
    <path d="M678 235H731L780 186V139L847 72H919"/>
    <circle cx="812" cy="139" r="39"/>
    <circle cx="812" cy="139" r="61" stroke-dasharray="3 9"/>
  </g>
  <g fill="#0b1729" stroke="#4c6b94" stroke-width="1.5">
    <circle cx="690" cy="62" r="5"/><circle cx="918" cy="221" r="5"/>
    <circle cx="678" cy="235" r="5"/><circle cx="919" cy="72" r="5"/>
  </g>
  <circle cx="812" cy="139" r="22" fill="#102a40" stroke="#67e8f9" stroke-opacity="0.5"/>
  <text x="812" y="145" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" fill="#a5f3fc">Z</text>
  <circle cx="812" cy="139" r="27" fill="none" stroke="#67e8f9" opacity="0">
    <animate attributeName="r" values="25;51" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#67e8f9"><animateMotion path="M690 62H760L812 114V163L870 221H918" dur="7s" repeatCount="indefinite"/></circle>
  <circle r="3" fill="#a5b4fc"><animateMotion path="M678 235H731L780 186V139L847 72H919" dur="8s" repeatCount="indefinite"/></circle>
</svg>
